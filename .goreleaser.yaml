version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: hashigo
    main: ./cmd/hashigo
    binary: hashigo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/kukv/hashigo/internal/cli.Version={{.Tag}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - README.ja.md
      - LICENSE*

checksum:
  name_template: checksums.txt

release:
  prerelease: auto

changelog:
  use: github-native
