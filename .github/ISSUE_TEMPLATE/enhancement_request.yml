name: Enhancement request
description: Suggest an improvement to something hashigo already does
labels: ["Kind: Enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For a change to an existing command, option, config key or message — it is awkward,
        too verbose, too quiet, or reads badly. Something hashigo does not do at all is a
        **Feature request**; something that does not work as the README describes is a
        **Bug report**.
  - type: input
    id: target
    attributes:
      label: What to improve
      description: The command, option, config key or behavior this is about.
      placeholder: the output of `hashigo cmd`, the `include` key, ...
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: How it works today
      description: What it does now, and where that falls short for you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How it should work
      description: What you would change. An example config or command line is welcome.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What `hashigo version` prints, so the current behavior can be checked.
      placeholder: v0.1.0
